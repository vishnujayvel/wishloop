<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <foreignObject width="800" height="360">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* ---------- BASE ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .rarv-root {
          width: 800px; height: 360px;
          background: #0d1117;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          position: relative;
          overflow: hidden;
          color: #7ee787;
        }

        /* ---------- LIGHT MODE ---------- */
        @media (prefers-color-scheme: light) {
          .rarv-root { background: #f6f8fa; color: #1f2328; }
          .rarv-root .title { color: #656d76 !important; }
          .rarv-root .node { background: #ffffff !important; border-color: #d0d7de !important; }
          .rarv-root .node .name { color: #1f2328 !important; }
          .rarv-root .node .desc { color: #656d76 !important; }
          .rarv-root .compound-node { background: #ffffff !important; border-color: #d0d7de !important; }
          .rarv-root .dead-letter { background: #ffffff !important; border-color: #d0d7de !important; }
          .rarv-root .badge { color: #ffffff !important; }
          .rarv-root .retry-counter { color: #656d76 !important; }
          .rarv-root .cycle-text { color: #656d76 !important; }
          .rarv-root .learning-text { color: #656d76 !important; }
          .rarv-root svg line, .rarv-root svg path { stroke: #656d76 !important; }
          .rarv-root svg polygon { fill: #656d76 !important; }
        }

        /* ---------- REDUCED MOTION ---------- */
        @media (prefers-reduced-motion: reduce) {
          .rarv-root * {
            animation-duration: 0.01s !important;
            animation-delay: 0s !important;
            animation-iteration-count: 1 !important;
          }
          .rarv-root .node { opacity: 1 !important; }
          .rarv-root .arrow-group { opacity: 1 !important; }
        }

        /* ---------- TITLE ---------- */
        .title {
          position: absolute;
          top: 10px; left: 50%;
          transform: translateX(-50%);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2.5px;
          text-transform: uppercase;
          color: #484f58;
          white-space: nowrap;
        }

        /* ---------- NODE COMMON ---------- */
        .node {
          position: absolute;
          width: 130px; height: 56px;
          border-radius: 10px;
          border: 2px solid;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          background: #161b22;
          opacity: 0.25;
          transition: none;
        }
        .node .name {
          font-size: 13px; font-weight: 700;
          letter-spacing: 1.2px; text-transform: uppercase;
        }
        .node .desc {
          font-size: 8.5px; color: #484f58;
          margin-top: 2px; text-align: center;
          line-height: 1.2;
          padding: 0 6px;
        }

        /* Node positions — diamond layout */
        .node-reason  { top: 50px;  left: 335px; border-color: #58a6ff; }
        .node-act     { top: 148px; left: 540px; border-color: #7ee787; }
        .node-reflect { top: 248px; left: 335px; border-color: #a371f7; }
        .node-verify  { top: 148px; left: 130px; border-color: #f0883e; }

        .node-reason  .name { color: #58a6ff; }
        .node-act     .name { color: #7ee787; }
        .node-reflect .name { color: #a371f7; }
        .node-verify  .name { color: #f0883e; }

        /* ---------- GLOW KEYFRAMES ---------- */
        @keyframes glowReason {
          0%, 8%   { opacity: 0.25; box-shadow: none; }
          10%      { opacity: 1;    box-shadow: 0 0 18px #58a6ff55; }
          20%      { opacity: 1;    box-shadow: 0 0 18px #58a6ff55; }
          22%      { opacity: 0.45; box-shadow: none; }
          /* second cycle (fast) */
          83%      { opacity: 0.45; }
          85%      { opacity: 1;    box-shadow: 0 0 14px #58a6ff44; }
          88%      { opacity: 0.45; box-shadow: none; }
          100%     { opacity: 0.25; box-shadow: none; }
        }
        @keyframes glowAct {
          0%, 20%  { opacity: 0.25; box-shadow: none; }
          22%      { opacity: 1;    box-shadow: 0 0 18px #7ee78755; }
          32%      { opacity: 1;    box-shadow: 0 0 18px #7ee78755; }
          35%      { opacity: 0.45; box-shadow: none; }
          /* second cycle */
          88%      { opacity: 0.45; }
          90%      { opacity: 1;    box-shadow: 0 0 14px #7ee78744; }
          92%      { opacity: 0.45; box-shadow: none; }
          100%     { opacity: 0.25; box-shadow: none; }
        }
        @keyframes glowReflect {
          0%, 32%  { opacity: 0.25; box-shadow: none; }
          35%      { opacity: 1;    box-shadow: 0 0 18px #a371f755; }
          44%      { opacity: 1;    box-shadow: 0 0 18px #a371f755; }
          47%      { opacity: 0.45; box-shadow: none; }
          /* second cycle */
          92%      { opacity: 0.45; }
          93%      { opacity: 1;    box-shadow: 0 0 14px #a371f744; }
          95%      { opacity: 0.45; box-shadow: none; }
          100%     { opacity: 0.25; box-shadow: none; }
        }
        @keyframes glowVerify {
          0%, 44%  { opacity: 0.25; box-shadow: none; }
          47%      { opacity: 1;    box-shadow: 0 0 18px #f0883e55; }
          56%      { opacity: 1;    box-shadow: 0 0 18px #f0883e55; }
          60%      { opacity: 0.45; box-shadow: none; }
          /* second cycle */
          95%      { opacity: 0.45; }
          96%      { opacity: 1;    box-shadow: 0 0 14px #f0883e44; }
          98%      { opacity: 0.45; box-shadow: none; }
          100%     { opacity: 0.25; box-shadow: none; }
        }

        .node-reason  { animation: glowReason  12s ease infinite; }
        .node-act     { animation: glowAct     12s ease infinite; }
        .node-reflect { animation: glowReflect 12s ease infinite; }
        .node-verify  { animation: glowVerify  12s ease infinite; }

        /* ---------- ARROWS (SVG overlays) ---------- */
        .arrow-svg {
          position: absolute; top: 0; left: 0;
          width: 800px; height: 360px;
          pointer-events: none;
        }

        /* Dashed flow animation */
        @keyframes dashFlow {
          to { stroke-dashoffset: -20; }
        }

        .arrow-group { opacity: 0; }

        /* Arrow timings — clockwise */
        @keyframes showArrowRA {
          0%, 18% { opacity: 0; } 20% { opacity: 0.9; } 100% { opacity: 0.9; }
        }
        @keyframes showArrowAR2 {
          0%, 32% { opacity: 0; } 34% { opacity: 0.9; } 100% { opacity: 0.9; }
        }
        @keyframes showArrowRV {
          0%, 44% { opacity: 0; } 46% { opacity: 0.9; } 100% { opacity: 0.9; }
        }
        @keyframes showArrowVR {
          0%, 7% { opacity: 0; } 9% { opacity: 0.9; } 100% { opacity: 0.9; }
        }
        /* Branch arrows */
        @keyframes showArrowPass {
          0%, 58% { opacity: 0; } 60% { opacity: 0.9; } 75% { opacity: 0.9; } 100% { opacity: 0.9; }
        }
        @keyframes showArrowFail {
          0%, 93% { opacity: 0; } 95% { opacity: 0.9; } 100% { opacity: 0.9; }
        }
        @keyframes showArrowBack {
          0%, 74% { opacity: 0; } 76% { opacity: 0.9; } 82% { opacity: 0.9; } 83% { opacity: 0; } 100% { opacity: 0; }
        }

        .arrow-r-a   { animation: showArrowRA   12s ease infinite; }
        .arrow-a-ref  { animation: showArrowAR2  12s ease infinite; }
        .arrow-ref-v  { animation: showArrowRV   12s ease infinite; }
        .arrow-v-r    { animation: showArrowVR   12s ease infinite; }
        .arrow-pass   { animation: showArrowPass  12s ease infinite; }
        .arrow-fail   { animation: showArrowFail  12s ease infinite; }
        .arrow-back   { animation: showArrowBack  12s ease infinite; }

        /* ---------- BADGES ---------- */
        .badge {
          position: absolute;
          font-size: 10px; font-weight: 700;
          padding: 2px 10px;
          border-radius: 6px;
          text-transform: uppercase;
          letter-spacing: 1px;
          opacity: 0;
          color: #fff;
        }
        .badge-pass {
          top: 130px; left: 100px;
          background: #238636;
          animation: badgePass 12s ease infinite;
        }
        .badge-fail {
          top: 130px; left: 100px;
          background: #da3633;
          animation: badgeFail 12s ease infinite;
        }
        @keyframes badgePass {
          0%, 56% { opacity: 0; } 58% { opacity: 1; } 74% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
        }
        @keyframes badgeFail {
          0%, 93% { opacity: 0; } 95% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0; }
        }

        /* ---------- COMPOUND NODE ---------- */
        .compound-node {
          position: absolute;
          top: 68px; left: 28px;
          width: 90px; height: 40px;
          border: 2px solid #238636;
          border-radius: 8px;
          background: #161b22;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          opacity: 0;
          animation: showCompound 12s ease infinite;
        }
        .compound-node .name {
          font-size: 9px; font-weight: 700;
          color: #7ee787; text-transform: uppercase;
          letter-spacing: 1px;
        }
        .compound-node .desc {
          font-size: 7.5px; color: #484f58; margin-top: 1px;
        }
        @keyframes showCompound {
          0%, 64% { opacity: 0; } 67% { opacity: 1; } 75% { opacity: 1; } 78% { opacity: 0; } 100% { opacity: 0; }
        }

        /* ---------- LEARNING TAG ---------- */
        .learning-tag {
          position: absolute;
          top: 112px; left: 32px;
          font-size: 8px;
          color: #7ee787;
          background: #0d1117;
          border: 1px solid #238636;
          border-radius: 4px;
          padding: 1px 6px;
          opacity: 0;
          animation: showLearningTag 12s ease infinite;
        }
        @keyframes showLearningTag {
          0%, 67% { opacity: 0; } 70% { opacity: 1; } 75% { opacity: 1; } 78% { opacity: 0; } 100% { opacity: 0; }
        }

        /* ---------- LEARNING TEXT ---------- */
        .learning-text {
          position: absolute;
          top: 46px; left: 14px;
          font-size: 8px; color: #484f58;
          font-style: italic;
          opacity: 0;
          animation: showLearning 12s ease infinite;
        }
        @keyframes showLearning {
          0%, 66% { opacity: 0; } 69% { opacity: 0.8; } 75% { opacity: 0.8; } 78% { opacity: 0; } 100% { opacity: 0; }
        }

        /* ---------- CYCLE TEXT ---------- */
        .cycle-text {
          position: absolute;
          top: 310px; left: 305px;
          font-size: 9px; color: #484f58;
          letter-spacing: 0.5px;
          opacity: 0;
          animation: showCycle 12s ease infinite;
          white-space: nowrap;
        }
        @keyframes showCycle {
          0%, 74% { opacity: 0; } 76% { opacity: 0.9; } 82% { opacity: 0.9; } 84% { opacity: 0; } 100% { opacity: 0; }
        }

        /* ---------- RETRY COUNTER ---------- */
        .retry-counter {
          position: absolute;
          bottom: 18px; right: 90px;
          font-size: 10px;
          color: #484f58;
          font-family: 'Courier New', monospace;
          letter-spacing: 0.5px;
          opacity: 0;
          animation: showRetry 12s ease infinite;
        }
        @keyframes showRetry {
          0%, 83% { opacity: 0; }
          85% { opacity: 0; content: "attempt: 1/5"; }
          93% { opacity: 0; }
          95% { opacity: 1; }
          99% { opacity: 1; }
          100% { opacity: 0; }
        }
        .retry-1 {
          animation: showRetry1 12s ease infinite;
        }
        .retry-2 {
          animation: showRetry2 12s ease infinite;
        }
        @keyframes showRetry1 {
          0%, 46% { opacity: 0; } 48% { opacity: 1; } 82% { opacity: 1; } 84% { opacity: 0; } 100% { opacity: 0; }
        }
        @keyframes showRetry2 {
          0%, 93% { opacity: 0; } 95% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0; }
        }

        /* ---------- DEAD LETTER ---------- */
        .dead-letter {
          position: absolute;
          bottom: 12px; right: 16px;
          width: 100px; height: 34px;
          border: 2px solid #da3633;
          border-radius: 6px;
          background: #161b22;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          opacity: 0.35;
        }
        .dead-letter .name {
          font-size: 8px; font-weight: 700;
          color: #da3633; text-transform: uppercase;
          letter-spacing: 1px;
        }
        .dead-letter .desc {
          font-size: 7px; color: #484f58; margin-top: 1px;
        }

        /* ---------- SUBTITLE TEXTS (brief descriptions) ---------- */
        .subtitle-text {
          position: absolute;
          font-size: 8px;
          color: #484f58;
          font-style: italic;
          opacity: 0;
          white-space: nowrap;
        }
        .sub-reason {
          top: 38px; left: 340px;
          animation: subReason 12s ease infinite;
        }
        @keyframes subReason {
          0%, 9% { opacity: 0; } 12% { opacity: 0.8; } 18% { opacity: 0.8; } 20% { opacity: 0; } 100% { opacity: 0; }
        }
        .sub-act {
          top: 202px; left: 548px;
          animation: subAct 12s ease infinite;
        }
        @keyframes subAct {
          0%, 22% { opacity: 0; } 25% { opacity: 0.8; } 30% { opacity: 0.8; } 33% { opacity: 0; } 100% { opacity: 0; }
        }
      </style>

      <div class="rarv-root">
        <!-- Title -->
        <div class="title">RARV -- Agent Inner Loop</div>

        <!-- Arrow layer -->
        <svg class="arrow-svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#484f58"/>
            </marker>
            <marker id="ah-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#238636"/>
            </marker>
            <marker id="ah-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#da3633"/>
            </marker>
          </defs>

          <!-- REASON -> ACT (top-right to right) -->
          <g class="arrow-group arrow-r-a">
            <line x1="465" y1="90" x2="540" y2="148"
                  stroke="#484f58" stroke-width="1.5"
                  stroke-dasharray="5,4"
                  marker-end="url(#ah)">
              <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
            </line>
          </g>

          <!-- ACT -> REFLECT (right to bottom) -->
          <g class="arrow-group arrow-a-ref">
            <line x1="540" y1="204" x2="465" y2="248"
                  stroke="#484f58" stroke-width="1.5"
                  stroke-dasharray="5,4"
                  marker-end="url(#ah)">
              <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
            </line>
          </g>

          <!-- REFLECT -> VERIFY (bottom to left) -->
          <g class="arrow-group arrow-ref-v">
            <line x1="335" y1="268" x2="260" y2="204"
                  stroke="#484f58" stroke-width="1.5"
                  stroke-dasharray="5,4"
                  marker-end="url(#ah)">
              <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
            </line>
          </g>

          <!-- VERIFY -> REASON (left to top — loop back after COMPOUND) -->
          <g class="arrow-group arrow-back">
            <path d="M 195 148 Q 260 50 335 62"
                  fill="none" stroke="#484f58" stroke-width="1.5"
                  stroke-dasharray="5,4"
                  marker-end="url(#ah)">
              <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
            </path>
          </g>

          <!-- VERIFY -> COMPOUND (pass path — upward-left) -->
          <g class="arrow-group arrow-pass">
            <line x1="130" y1="155" x2="118" y2="108"
                  stroke="#238636" stroke-width="1.5"
                  stroke-dasharray="5,4"
                  marker-end="url(#ah-green)">
              <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.8s" repeatCount="indefinite"/>
            </line>
          </g>

          <!-- VERIFY -> REASON (fail retry — upper arc) -->
          <g class="arrow-group arrow-fail">
            <path d="M 195 148 Q 150 40 335 58"
                  fill="none" stroke="#da3633" stroke-width="1.5"
                  stroke-dasharray="5,4"
                  marker-end="url(#ah-red)">
              <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.6s" repeatCount="indefinite"/>
            </path>
          </g>

          <!-- VERIFY initial arrow (first appearance in cycle) -->
          <g class="arrow-group arrow-v-r">
            <path d="M 260 160 Q 300 120 335 78"
                  fill="none" stroke="#484f58" stroke-width="1"
                  stroke-dasharray="3,4" opacity="0.3">
              <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1s" repeatCount="indefinite"/>
            </path>
          </g>
        </svg>

        <!-- Nodes -->
        <div class="node node-reason">
          <span class="name">Reason</span>
          <span class="desc">Highest priority unblocked task</span>
        </div>
        <div class="node node-act">
          <span class="name">Act</span>
          <span class="desc">Execute. Write code. Commit.</span>
        </div>
        <div class="node node-reflect">
          <span class="name">Reflect</span>
          <span class="desc">Did it work? Log outcome.</span>
        </div>
        <div class="node node-verify">
          <span class="name">Verify</span>
          <span class="desc">Run tests. Check build.</span>
        </div>

        <!-- Badges on VERIFY -->
        <div class="badge badge-pass">Pass</div>
        <div class="badge badge-fail">Fail</div>

        <!-- Compound node (top-left of VERIFY) -->
        <div class="compound-node">
          <span class="name">Compound</span>
          <span class="desc">Extract learning</span>
        </div>
        <div class="learning-tag">performance</div>
        <div class="learning-text">Learning extracted</div>

        <!-- Subtitle texts -->
        <div class="subtitle-text sub-reason">What is highest priority?</div>
        <div class="subtitle-text sub-act">git commit -m "feat: ..."</div>

        <!-- Cycle indicator -->
        <div class="cycle-text">Task complete. Next task.</div>

        <!-- Retry counter -->
        <div class="retry-counter retry-1">attempt: 1/5</div>
        <div class="retry-counter retry-2">attempt: 2/5</div>

        <!-- Dead letter box -->
        <div class="dead-letter">
          <span class="name">Dead Letter</span>
          <span class="desc">5 fails reached</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>